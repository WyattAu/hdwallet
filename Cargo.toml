[package]
name = "multi-chain-wallet"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "HD wallet for Rust — BIP32/39/44 derivation with multi-chain address generation (BTC, ETH, SOL, TRON)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/hdwallet"
keywords = ["hdwallet", "bip32", "bip39", "bitcoin", "ethereum"]
categories = ["cryptography"]
exclude = ["/target"]

[dependencies]
bip32 = { version = "0.5", features = ["bip39"] }
ed25519-dalek = "2.1"
k256 = { version = "0.13", features = ["ecdsa", "arithmetic"] }
sha2 = "0.10"
sha3 = "0.10"
ripemd = "0.1"
bs58 = "0.5"
zeroize = { version = "1", features = ["derive"] }
thiserror = "2"
rand_core = "0.6"
hmac = "0.12"
hex = "0.4"

[dev-dependencies]
proptest = "1"
